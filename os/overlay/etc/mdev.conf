# Who may open which device (BusyBox mdev, run by /init). Anything not
# listed is root-only (0660). These are open to everyone, as on any
# Linux system, because adb's shell runs as the "shell" user, not
# root: it needs a pseudo-terminal (ptmx), the usual null, zero and
# random devices, and adb's own device.
null		0:0 666
zero		0:0 666
full		0:0 666
random		0:0 666
urandom		0:0 666
tty		0:0 666
ptmx		0:0 666
android_adb	0:0 666
